<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Presupuesto HZ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap">
<style>
  :root{
    --bg:#eef2ef;
    --surface:#ffffff;
    --surface-2:#e4ebe6;
    --ink:#142420;
    --ink-soft:#51625b;
    --ink-faint:#8a988f;
    --line:#d7ded9;
    --accent:#1f7a5c;
    --accent-deep:#145a43;
    --accent-tint:#e3f1ea;
    --gold:#a9791f;
    --gold-tint:#f6ecd8;
    --red:#ad3f2c;
    --red-tint:#f7e4de;
    --shadow: 0 1px 2px rgba(20,36,32,.06), 0 8px 24px -12px rgba(20,36,32,.18);

    --gen-casa:#2f6fa8;
    --gen-personal:#b23e77;
    --gen-ahorro:#1f7a5c;
    --gen-seguro:#7a5fa0;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0e1613;
      --surface:#16221d;
      --surface-2:#1c2b24;
      --ink:#eef2ef;
      --ink-soft:#a9b9b1;
      --ink-faint:#6d7c74;
      --line:#28362f;
      --accent:#49b590;
      --accent-deep:#63c9a4;
      --accent-tint:#1a3129;
      --gold:#d6ab52;
      --gold-tint:#332a15;
      --red:#e07862;
      --red-tint:#3a1f19;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 28px -14px rgba(0,0,0,.55);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0e1613;
    --surface:#16221d;
    --surface-2:#1c2b24;
    --ink:#eef2ef;
    --ink-soft:#a9b9b1;
    --ink-faint:#6d7c74;
    --line:#28362f;
    --accent:#49b590;
    --accent-deep:#63c9a4;
    --accent-tint:#1a3129;
    --gold:#d6ab52;
    --gold-tint:#332a15;
    --red:#e07862;
    --red-tint:#3a1f19;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 28px -14px rgba(0,0,0,.55);
  }

  *{box-sizing:border-box;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Public Sans", ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.brand{
    font-family:"Fraunces", Georgia, serif;
    text-wrap:balance;
  }
  .num, input[type="number"], .amount{
    font-family:"JetBrains Mono", ui-monospace, SFMono-Regular, monospace;
    font-variant-numeric:tabular-nums;
  }
  button, input, select{ font:inherit; color:inherit; }
  button{ cursor:pointer; }

  #app{ max-width:960px; margin:0 auto; padding:0 16px 96px; min-height:100vh; }

  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    gap:12px; padding:20px 0 14px; flex-wrap:wrap;
  }
  .brand{ font-size:1.5rem; font-weight:600; color:var(--ink); letter-spacing:-.01em; }
  .brand small{ display:block; font-family:"Public Sans",sans-serif; font-weight:500; font-size:.72rem; color:var(--ink-faint); letter-spacing:.06em; text-transform:uppercase; margin-top:2px; }

  .month-nav{ display:flex; align-items:center; gap:10px; }
  .month-nav button{
    width:32px; height:32px; border-radius:999px; border:1px solid var(--line);
    background:var(--surface); color:var(--ink-soft); font-size:1rem; line-height:1;
    display:flex; align-items:center; justify-content:center;
  }
  .month-nav button:hover{ border-color:var(--accent); color:var(--accent); }
  .month-label{ font-weight:600; min-width:150px; text-align:center; text-transform:capitalize; }

  .who-chip{
    display:flex; align-items:center; gap:8px; padding:6px 12px 6px 6px;
    background:var(--surface); border:1px solid var(--line); border-radius:999px;
  }
  .who-chip .avatar{
    width:24px; height:24px; border-radius:999px; background:var(--accent);
    color:#fff; font-size:.72rem; font-weight:700; display:flex; align-items:center; justify-content:center;
  }
  .who-chip span{ font-size:.85rem; font-weight:600; }
  .who-chip button{ background:none; border:0; color:var(--ink-faint); font-size:.78rem; text-decoration:underline; padding:0; }

  .tabs{
    display:flex; gap:4px; border-bottom:1px solid var(--line); margin-bottom:24px;
    overflow-x:auto;
  }
  .tabs button{
    background:none; border:0; padding:12px 16px; font-weight:600; font-size:.92rem;
    color:var(--ink-faint); border-bottom:2px solid transparent; white-space:nowrap;
  }
  .tabs button.active{ color:var(--accent-deep); border-bottom-color:var(--accent); }
  .tabs button:hover:not(.active){ color:var(--ink-soft); }

  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:14px;
    box-shadow:var(--shadow);
  }

  .summary-row{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; margin-bottom:22px; }
  .summary-tile{ padding:16px 18px; }
  .summary-tile .label{ font-size:.72rem; text-transform:uppercase; letter-spacing:.07em; color:var(--ink-faint); font-weight:600; margin-bottom:6px; }
  .summary-tile .value{ font-size:1.5rem; font-weight:700; }
  .summary-tile .value.over{ color:var(--red); }
  .summary-tile .value.good{ color:var(--accent-deep); }

  .overall-bar-wrap{ margin-bottom:26px; }
  .overall-bar-wrap .bar-track{ height:10px; }
  .overall-bar-wrap .meta{ display:flex; justify-content:space-between; margin-top:6px; font-size:.8rem; color:var(--ink-soft); }

  .section-title{ font-size:1.05rem; font-weight:700; margin:0 0 12px; }
  .hint{ font-size:.8rem; color:var(--ink-faint); margin:-6px 0 18px; }

  .group-card{ padding:16px 18px; margin-bottom:14px; }
  .group-head{ display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .group-head .dot{ width:11px; height:11px; }
  .group-head .g-name{ font-weight:700; font-size:.98rem; flex:1; }
  .group-head .g-pct{ font-size:.78rem; color:var(--ink-faint); }
  .group-amounts{ display:flex; justify-content:space-between; font-size:.82rem; margin-top:6px; }
  .group-amounts .spent{ font-weight:600; }
  .group-amounts .budget{ color:var(--ink-faint); }
  .sub-list{ margin-top:12px; border-top:1px solid var(--line); padding-top:10px; display:flex; flex-direction:column; gap:9px; }
  .sub-row{ display:flex; align-items:center; gap:8px; font-size:.82rem; }
  .sub-row .dot{ width:7px; height:7px; opacity:.75; }
  .sub-row .s-name{ flex:1; color:var(--ink-soft); }
  .sub-row .s-bar{ width:80px; }
  .sub-row .s-amt{ min-width:74px; text-align:right; font-weight:600; }
  .over-flag{ margin-top:6px; font-size:.75rem; color:var(--red); font-weight:600; }

  .bar-track{ height:8px; background:var(--surface-2); border-radius:999px; overflow:hidden; }
  .bar-fill{ height:100%; border-radius:999px; transition:width .3s ease; }
  .bar-track.thin{ height:5px; }

  .empty-state{ text-align:center; padding:56px 20px; color:var(--ink-soft); }
  .empty-state h3{ margin:0 0 6px; font-size:1.2rem; color:var(--ink); }
  .empty-state p{ margin:0 0 18px; font-size:.92rem; }

  .btn-primary{
    background:var(--accent); color:#fff; border:0; border-radius:10px;
    padding:11px 20px; font-weight:600; font-size:.92rem;
  }
  .btn-primary:hover{ background:var(--accent-deep); }
  .btn-ghost{
    background:none; border:1px solid var(--line); border-radius:10px;
    padding:10px 18px; font-weight:600; font-size:.88rem; color:var(--ink-soft);
  }
  .btn-ghost:hover{ border-color:var(--accent); color:var(--accent-deep); }

  /* Tarjetas de crédito (resumen) */
  .cards-card{ padding:6px 0 2px; margin-bottom:22px; }
  .cards-card .section-title{ padding:14px 18px 0; }
  .card-row{
    display:flex; align-items:center; gap:12px; padding:11px 18px; border-bottom:1px solid var(--line);
  }
  .card-row:last-child{ border-bottom:0; }
  .card-row .c-name{ flex:1; font-weight:600; font-size:.88rem; }
  .card-row .c-due{ font-size:.76rem; color:var(--ink-faint); min-width:110px; }
  .card-row .c-amt{ font-weight:700; font-size:.92rem; min-width:100px; text-align:right; }

  /* Agregar */
  .form-card{ padding:22px; max-width:480px; margin:0 auto; }
  .amount-field{ text-align:center; margin-bottom:22px; }
  .amount-field label{ display:block; font-size:.78rem; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-faint); font-weight:600; margin-bottom:8px; }
  .amount-field .amount-input-wrap{ display:flex; align-items:baseline; justify-content:center; gap:6px; }
  .amount-field .q{ font-size:1.6rem; color:var(--ink-faint); font-family:"JetBrains Mono",monospace; }
  .amount-field input{
    border:0; background:none; font-size:2.6rem; font-weight:700; width:220px; text-align:center;
    color:var(--ink); border-bottom:2px solid var(--line);
  }
  .amount-field input:focus{ outline:none; border-bottom-color:var(--accent); }

  .field-label{ font-size:.78rem; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-faint); font-weight:600; margin:18px 0 8px; }

  .select-input, select.text-input{
    width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px;
    background:var(--surface); color:var(--ink); appearance:none;
    background-image:linear-gradient(45deg, transparent 50%, var(--ink-faint) 50%), linear-gradient(135deg, var(--ink-faint) 50%, transparent 50%);
    background-position:calc(100% - 18px) center, calc(100% - 13px) center;
    background-size:5px 5px, 5px 5px; background-repeat:no-repeat;
  }
  optgroup{ font-weight:700; font-style:normal; }

  .text-input, .form-card input[type="text"], .form-card input[type="date"]{
    width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px;
    background:var(--surface); color:var(--ink);
  }
  .text-input:focus, .form-card input:focus, .select-input:focus{ outline:none; border-color:var(--accent); }

  .pay-toggle{ display:flex; gap:8px; }
  .pay-toggle button{
    flex:1; padding:10px 8px; border-radius:9px; border:1px solid var(--line); background:var(--surface);
    font-weight:600; font-size:.82rem; color:var(--ink-soft);
  }
  .pay-toggle button.selected{ background:var(--accent-tint); border-color:var(--accent); color:var(--accent-deep); }

  .form-card .submit-row{ margin-top:24px; display:flex; gap:10px; }
  .form-card .submit-row button{ flex:1; }

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:var(--bg); padding:10px 18px; border-radius:999px;
    font-size:.85rem; font-weight:600; box-shadow:var(--shadow); opacity:0; pointer-events:none;
    transition:opacity .25s ease, transform .25s ease;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(-6px); }

  /* Historial */
  .hist-group{ margin-bottom:18px; }
  .hist-date{ font-size:.76rem; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-faint); font-weight:700; margin:0 0 8px 4px; }
  .hist-row{
    display:flex; align-items:center; gap:10px; padding:12px 14px; border-bottom:1px solid var(--line);
  }
  .hist-row:last-child{ border-bottom:0; }
  .hist-cat{ flex:none; }
  .hist-main{ flex:1; min-width:0; }
  .hist-desc{ font-weight:600; font-size:.9rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .hist-sub{ font-size:.76rem; color:var(--ink-faint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .hist-amount{ font-weight:700; font-size:.94rem; flex:none; }
  .hist-del{ flex:none; background:var(--surface-2); border:0; color:var(--ink-soft); font-size:1rem; width:26px; height:26px; line-height:1; border-radius:999px; }
  .hist-del:hover{ color:var(--red); background:var(--red-tint); }
  .hist-del.confirm{ color:#fff; background:var(--red); }
  .person-badge{
    display:inline-flex; width:18px; height:18px; border-radius:999px; background:var(--surface-2);
    color:var(--ink-soft); font-size:.62rem; font-weight:700; align-items:center; justify-content:center;
    margin-right:2px; vertical-align:middle;
  }

  /* Presupuestos */
  .budget-group-title{ display:flex; align-items:center; gap:8px; padding:14px 16px 0; font-weight:700; font-size:.92rem; }
  .budget-group-title .dot{ width:9px; height:9px; }
  .budget-group-title .g-total{ margin-left:auto; font-weight:600; color:var(--ink-faint); font-size:.78rem; }
  .budget-row{
    display:flex; align-items:center; gap:12px; padding:11px 16px; border-bottom:1px solid var(--line);
  }
  .budget-row:last-child{ border-bottom:0; }
  .budget-row .cat-name{ flex:1; font-size:.88rem; }
  .budget-row .q-prefix{ color:var(--ink-faint); font-size:.9rem; }
  .budget-row input{
    width:100px; text-align:right; padding:7px 9px; border:1px solid var(--line); border-radius:8px;
    background:var(--surface); color:var(--ink);
  }
  .budget-row input:focus{ outline:none; border-color:var(--accent); }
  .saved-flash{ font-size:.72rem; color:var(--accent-deep); font-weight:600; opacity:0; transition:opacity .2s; margin-left:4px; }
  .saved-flash.show{ opacity:1; }

  .people-card{ padding:18px 20px; margin-bottom:18px; }
  .people-fields{ display:flex; gap:12px; margin-top:10px; flex-wrap:wrap; }
  .people-fields label{ flex:1; min-width:160px; }
  .people-fields span{ display:block; font-size:.76rem; color:var(--ink-faint); margin-bottom:5px; font-weight:600; }

  .mode-flag{
    display:inline-flex; align-items:center; gap:6px; font-size:.72rem; color:var(--gold);
    background:var(--gold-tint); padding:4px 10px; border-radius:999px; font-weight:600; margin-bottom:16px;
  }

  /* Recurrentes: pendientes (banner en Resumen) */
  .pending-card{ padding:16px 18px; margin-bottom:20px; border-color:var(--gold); }
  .pending-card .section-title{ display:flex; align-items:center; gap:8px; }
  .pending-card .section-title .badge-count{
    background:var(--gold); color:#fff; border-radius:999px; font-size:.68rem; font-weight:700;
    width:20px; height:20px; display:inline-flex; align-items:center; justify-content:center;
  }
  .pending-row{
    display:flex; align-items:center; gap:10px; padding:10px 0; border-top:1px solid var(--line); flex-wrap:wrap;
  }
  .pending-row:first-of-type{ border-top:0; }
  .pending-row .p-info{ flex:1; min-width:140px; }
  .pending-row .p-name{ font-weight:600; font-size:.9rem; }
  .pending-row .p-meta{ font-size:.76rem; color:var(--ink-faint); }
  .pending-row .p-amount{ display:flex; align-items:baseline; gap:4px; }
  .pending-row .p-amount .q-prefix{ color:var(--ink-faint); font-size:.85rem; }
  .pending-row .p-amount input{
    width:90px; padding:6px 8px; border:1px solid var(--line); border-radius:7px; background:var(--surface); color:var(--ink);
  }
  .pending-row .p-actions{ display:flex; gap:6px; }
  .pending-row .p-actions button{ padding:8px 12px; font-size:.8rem; border-radius:8px; }
  .pending-row .p-skip{ background:none; border:1px solid var(--line); color:var(--ink-faint); }
  .pending-row .p-skip:hover{ border-color:var(--ink-faint); color:var(--ink-soft); }

  /* Recurrentes: tab de administración */
  .recurring-row{
    display:flex; align-items:center; gap:12px; padding:13px 16px; border-bottom:1px solid var(--line);
  }
  .recurring-row:last-child{ border-bottom:0; }
  .recurring-row .dot{ width:9px; height:9px; flex:none; }
  .recurring-row .r-info{ flex:1; min-width:0; }
  .recurring-row .r-name{ font-weight:600; font-size:.9rem; }
  .recurring-row .r-meta{ font-size:.76rem; color:var(--ink-faint); }
  .recurring-row .r-amount{ font-weight:700; font-size:.9rem; min-width:90px; text-align:right; }
  .recurring-row .r-actions{ display:flex; gap:4px; flex:none; }
  .recurring-row .r-actions button{
    background:none; border:0; color:var(--ink-faint); font-size:.78rem; padding:5px 8px; border-radius:6px;
  }
  .recurring-row .r-actions button:hover{ background:var(--surface-2); color:var(--ink); }
  .recurring-row.inactive{ opacity:.5; }
  .recurring-empty{ padding:14px 16px; font-size:.85rem; color:var(--ink-faint); }
  .recurring-form-toggle{ padding:14px 16px; }

  /* Ahorros */
  .fund-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:18px; }
  .fund-card{ padding:18px 20px; }
  .fund-head{ display:flex; align-items:center; gap:8px; margin-bottom:2px; }
  .fund-head .dot{ width:10px; height:10px; }
  .fund-head .f-name{ font-weight:700; font-size:.95rem; }
  .fund-head .f-lock{ margin-left:auto; font-size:.68rem; color:var(--ink-faint); background:var(--surface-2); padding:3px 8px; border-radius:999px; font-weight:600; }
  .fund-balance{ font-size:2rem; font-weight:700; margin:8px 0 4px; }
  .fund-sub{ font-size:.78rem; color:var(--ink-faint); margin-bottom:14px; }
  .fund-actions{ display:flex; gap:8px; }
  .fund-actions button{ flex:1; }

  .mini-form{ display:flex; flex-direction:column; gap:8px; margin-top:14px; padding-top:14px; border-top:1px solid var(--line); }
  .mini-form .row2{ display:flex; gap:8px; }
  .mini-form input{ padding:9px 10px; border:1px solid var(--line); border-radius:8px; background:var(--surface); color:var(--ink); }
  .mini-form input:focus{ outline:none; border-color:var(--accent); }

  .mov-list{ margin-top:6px; }
  .mov-row{ display:flex; align-items:center; gap:10px; padding:10px 0; border-top:1px solid var(--line); }
  .mov-row:first-child{ border-top:0; }
  .mov-row .m-sign{ width:22px; height:22px; border-radius:999px; flex:none; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:.85rem; }
  .mov-row .m-sign.in{ background:var(--accent-tint); color:var(--accent-deep); }
  .mov-row .m-sign.out{ background:var(--red-tint); color:var(--red); }
  .mov-row .m-info{ flex:1; min-width:0; }
  .mov-row .m-desc{ font-size:.88rem; font-weight:600; }
  .mov-row .m-date{ font-size:.75rem; color:var(--ink-faint); }
  .mov-row .m-amt{ font-weight:700; font-size:.9rem; }
  .mov-row .m-amt.in{ color:var(--accent-deep); }
  .mov-row .m-amt.out{ color:var(--red); }
  .mov-row .m-del{ background:var(--surface-2); border:0; color:var(--ink-soft); width:24px; height:24px; border-radius:999px; font-size:.9rem; flex:none; }
  .mov-row .m-del:hover{ color:var(--red); background:var(--red-tint); }
  .mov-row .m-del.confirm{ color:#fff; background:var(--red); }

  @media (max-width:640px){
    .fund-grid{ grid-template-columns:1fr; }
  }

  /* Graficas */
  .chart-card{ padding:20px 18px 14px; }
  .chart-wrap{ position:relative; }
  .chart-wrap svg{ width:100%; height:auto; display:block; overflow:visible; }
  .chart-axis-label{ font-size:9px; fill:var(--ink-faint); font-family:"Public Sans",sans-serif; }
  .chart-grid-line{ stroke:var(--line); stroke-width:1; }
  .chart-line{ fill:none; stroke:var(--accent); stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round; }
  .chart-area{ fill:var(--accent); opacity:.10; }
  .chart-dot{ fill:var(--surface); stroke:var(--accent); stroke-width:2.5; }
  .chart-dot.endpoint{ fill:var(--accent); }
  .chart-hover-line{ stroke:var(--ink-faint); stroke-width:1; stroke-dasharray:3 3; }
  .chart-tooltip{
    position:absolute; pointer-events:none; background:var(--ink); color:var(--bg);
    padding:6px 10px; border-radius:8px; font-size:.76rem; font-weight:600; white-space:nowrap;
    transform:translate(-50%,-100%); box-shadow:var(--shadow); opacity:0; transition:opacity .12s;
  }
  .chart-tooltip.show{ opacity:1; }

  #picker-overlay{
    position:fixed; inset:0; background:var(--bg); display:flex; align-items:center; justify-content:center;
    z-index:50; flex-direction:column; text-align:center; padding:24px;
  }
  #picker-overlay h1{ font-size:1.7rem; margin:0 0 6px; }
  #picker-overlay p{ color:var(--ink-soft); margin:0 0 26px; max-width:340px; }
  .picker-btns{ display:flex; gap:12px; flex-wrap:wrap; justify-content:center; }
  .picker-btn{
    padding:16px 26px; border-radius:14px; border:1px solid var(--line); background:var(--surface);
    font-weight:600; font-size:1rem; min-width:140px; box-shadow:var(--shadow);
  }
  .picker-btn:hover{ border-color:var(--accent); color:var(--accent-deep); }

  @media (max-width:640px){
    .summary-row{ grid-template-columns:1fr 1fr; }
    .summary-row .summary-tile:nth-child(3){ grid-column:1 / -1; }
    .topbar{ flex-direction:column; align-items:flex-start; }
    .month-nav{ order:2; }
    .who-chip{ order:1; align-self:flex-end; margin-top:-40px; }
    .sub-row .s-bar{ width:52px; }
  }
</style>
</head>
<body>

<div id="picker-overlay" hidden>
  <h1>Presupuesto HZ</h1>
  <p>¿Quién va a registrar el gasto? Esto solo se guarda en este dispositivo.</p>
  <div class="picker-btns" id="picker-btns"></div>
</div>

<div id="app">
  <header class="topbar">
    <div class="brand">Presupuesto HZ<small>Gastos del hogar</small></div>
    <div class="month-nav">
      <button id="prev-month" aria-label="Mes anterior">‹</button>
      <div class="month-label" id="month-label">—</div>
      <button id="next-month" aria-label="Mes siguiente">›</button>
    </div>
    <div class="who-chip">
      <div class="avatar" id="who-avatar">?</div>
      <span id="who-name">—</span>
      <button id="who-switch">cambiar</button>
    </div>
  </header>

  <nav class="tabs" id="tabs">
    <button data-tab="resumen" class="active">Resumen</button>
    <button data-tab="agregar">Agregar</button>
    <button data-tab="historial">Historial</button>
    <button data-tab="recurrentes">Recurrentes</button>
    <button data-tab="ahorros">Ahorros</button>
    <button data-tab="graficas">Gráficas</button>
    <button data-tab="presupuestos">Presupuestos</button>
  </nav>

  <main id="view"></main>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  var GENERALS = [
    { id:"casa", name:"Casa/Servicios", color:"var(--gen-casa)" },
    { id:"personal", name:"Personal", color:"var(--gen-personal)" },
    { id:"ahorro", name:"Ahorro", color:"var(--gen-ahorro)" },
    { id:"seguro", name:"Seguro", color:"var(--gen-seguro)" }
  ];
  function genById(id){ for (var i=0;i<GENERALS.length;i++) if (GENERALS[i].id===id) return GENERALS[i]; return GENERALS[0]; }

  var CATEGORIES = [
    { id:"supermercado", name:"Supermercado", general:"casa" },
    { id:"mercado", name:"Mercado", general:"casa" },
    { id:"otros_alimentos", name:"Otros Alimentos", general:"casa" },
    { id:"agua", name:"Agua", general:"casa" },
    { id:"luz", name:"Luz", general:"casa" },
    { id:"telefono_internet", name:"Teléfono/Internet", general:"casa" },
    { id:"empleada", name:"Empleada", general:"casa" },
    { id:"basura", name:"Basura", general:"casa" },
    { id:"seguridad", name:"Seguridad", general:"casa" },
    { id:"jardinero", name:"Jardinero", general:"casa" },
    { id:"streaming", name:"Plataformas Streaming", general:"casa" },
    { id:"celular", name:"Celular", general:"casa" },
    { id:"gasolina", name:"Gasolina", general:"casa" },
    { id:"gas", name:"Gas", general:"casa" },
    { id:"salidas", name:"Salidas", general:"personal" },
    { id:"regalos", name:"Regalos", general:"personal" },
    { id:"servicio_carro", name:"Servicio de Carro", general:"personal" },
    { id:"gimnasio", name:"Gimnasio", general:"personal" },
    { id:"retiro_efectivo", name:"Retiro Efectivo", general:"personal" },
    { id:"otros", name:"Otros", general:"personal" },
    { id:"ahorro_viaje", name:"Ahorro Viaje", general:"ahorro" },
    { id:"ahorro_futuro", name:"Ahorro Futuro", general:"ahorro" },
    { id:"seguro_vida", name:"Seguro de Vida", general:"seguro" },
    { id:"seguro_medico", name:"Seguro Médico", general:"seguro" },
    { id:"seguro_carro", name:"Seguro Carro", general:"seguro" }
  ];
  function catById(id){ for (var i=0;i<CATEGORIES.length;i++) if (CATEGORIES[i].id===id) return CATEGORIES[i]; return CATEGORIES[CATEGORIES.length-1]; }
  function catColor(cat){ return genById(cat.general).color; }

  var PAY_METHODS = [
    { id:"credito", name:"Tarjeta de Crédito" },
    { id:"debito", name:"Tarjeta de Débito" },
    { id:"efectivo", name:"Efectivo" }
  ];

  var CARDS = [
    { id:"majo_gt", label:"Majo - G&T", dueDay:4 },
    { id:"majo_bac", label:"Majo - BAC", dueDay:null },
    { id:"wicho_gt_platinum", label:"Wicho - G&T Platinum", dueDay:28 },
    { id:"wicho_gt_clasica", label:"Wicho - G&T Clásica", dueDay:28 },
    { id:"wicho_bac", label:"Wicho - BAC", dueDay:11 }
  ];
  function cardById(id){ for (var i=0;i<CARDS.length;i++) if (CARDS[i].id===id) return CARDS[i]; return null; }

  var DEFAULT_PEOPLE = { p1:"Wicho", p2:"Majo" };

  var FONDOS = [
    { id:"ahorro_futuro", name:"Ahorro Futuro", category:"ahorro_futuro", withdrawable:false },
    { id:"ahorro_viaje", name:"Ahorro Viaje", category:"ahorro_viaje", withdrawable:true }
  ];
  function fondoById(id){ for (var i=0;i<FONDOS.length;i++) if (FONDOS[i].id===id) return FONDOS[i]; return null; }

  var state = {
    connectionError: false,
    syncing: false,
    expenses: [],
    budgets: {},
    people: DEFAULT_PEOPLE,
    recurringTemplates: [],
    recurringLog: {},
    savingsWithdrawals: [],
    currentUser: null,
    tab: "resumen",
    monthDate: new Date(),
    selectedCategory: CATEGORIES[0].id,
    selectedPay: "efectivo",
    selectedCard: CARDS[0].id,
    rSelectedCategory: CATEGORIES[0].id,
    rSelectedPay: "efectivo",
    rSelectedCard: CARDS[0].id
  };

  function pad2(n){ return (n<10? "0":"") + n; }
  function monthKey(d){ return d.getFullYear() + "-" + pad2(d.getMonth()+1); }
  function todayISO(){ var d=new Date(); return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
  function fmtQ(n){
    n = Number(n)||0;
    return "Q " + n.toLocaleString("es-GT", { minimumFractionDigits:2, maximumFractionDigits:2 });
  }
  function fmtQCompact(n){
    n = Number(n)||0;
    if (Math.abs(n) >= 1000) return "Q " + (n/1000).toLocaleString("es-GT", { maximumFractionDigits:1 }) + "k";
    return "Q " + n.toLocaleString("es-GT", { maximumFractionDigits:0 });
  }
  var MONTH_NAMES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
  var MONTH_ABBR = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
  function monthLabel(d){ return MONTH_NAMES[d.getMonth()] + " " + d.getFullYear(); }

  function showToast(msg){
    var t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(t._h);
    t._h = setTimeout(function(){ t.classList.remove("show"); }, 2200);
  }

  // ---------- storage backend (Google Sheets vía Apps Script) ----------
  // Pega aquí la URL que te dio "Implementar > Nueva implementación" en Apps Script.
  var API_URL = "https://script.google.com/macros/s/AKfycbwyyH-tCAVg7RRfCyoZhcCp84mvqaUV0w3tlogL6vRvnwSh6nIPeP4cEUqvtR2-vs3G/exec";

  function toNumber(v){ var n = Number(v); return isNaN(n) ? 0 : n; }
  function toBool(v){ return v === true || v === "TRUE" || v === "true" || v === 1; }

  function apiGet(){
    return fetch(API_URL, { method:"GET" }).then(function(res){
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.json();
    });
  }
  // Content-Type text/plain evita que el navegador mande una petición
  // "preflight" (OPTIONS) que Apps Script no sabe responder.
  function apiPost(payload){
    return fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload)
    }).then(function(res){
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.json();
    }).then(function(json){
      if (!json || json.ok === false) throw new Error((json && json.error) || "Error desconocido");
      return json;
    });
  }

  function applySnapshot(json){
    state.expenses = (json.expenses || []).map(function(e){
      return Object.assign({}, e, {
        amount: toNumber(e.amount), createdAt: toNumber(e.createdAt),
        card: e.card || null, date: String(e.date || "").slice(0,10)
      });
    });
    state.recurringTemplates = (json.recurrentes || []).map(function(t){
      return Object.assign({}, t, {
        amount: toNumber(t.amount), createdAt: toNumber(t.createdAt),
        day: t.day ? toNumber(t.day) : null, active: t.active === "" ? true : toBool(t.active),
        card: t.card || null
      });
    });
    state.savingsWithdrawals = (json.retiros || []).map(function(w){
      return Object.assign({}, w, {
        amount: toNumber(w.amount), createdAt: toNumber(w.createdAt),
        date: String(w.date || "").slice(0,10)
      });
    });
    var settings = json.settings || {};
    state.budgets = settings.budgets || {};
    state.people = settings.people || DEFAULT_PEOPLE;
    state.recurringLog = settings.recurringLog || {};
  }

  function syncNow(showErrors){
    state.syncing = true;
    return apiGet().then(function(json){
      applySnapshot(json);
      state.connectionError = false;
      state.syncing = false;
      render();
    }).catch(function(err){
      state.syncing = false;
      state.connectionError = true;
      render();
      if (showErrors) showToast("No se pudo conectar con la Hoja de Google");
    });
  }

  function addExpense(data){
    return apiPost({ sheet:"Gastos", op:"add", data:data })
      .then(function(){ return syncNow(); })
      .catch(function(){ showToast("No se pudo guardar. Intenta de nuevo."); });
  }

  function deleteExpense(id){
    return apiPost({ sheet:"Gastos", op:"delete", id:id })
      .then(function(){ return syncNow(); })
      .catch(function(){ showToast("No se pudo eliminar."); });
  }

  function saveBudgets(){
    return apiPost({ type:"setting", key:"budgets", value:state.budgets })
      .catch(function(){ showToast("No se pudo guardar el presupuesto."); });
  }

  function savePeople(){
    return apiPost({ type:"setting", key:"people", value:state.people })
      .catch(function(){ showToast("No se pudo guardar."); });
  }

  function addRecurring(data){
    return apiPost({ sheet:"Recurrentes", op:"add", data:data })
      .then(function(){ return syncNow(); })
      .catch(function(){ showToast("No se pudo guardar."); });
  }

  function updateRecurringFull(id, fullData){
    return apiPost({ sheet:"Recurrentes", op:"update", id:id, data:fullData })
      .then(function(){ return syncNow(); })
      .catch(function(){ showToast("No se pudo guardar."); });
  }

  function deleteRecurring(id){
    return apiPost({ sheet:"Recurrentes", op:"delete", id:id })
      .then(function(){ return syncNow(); })
      .catch(function(){ showToast("No se pudo eliminar."); });
  }

  function saveRecurringLog(){
    return apiPost({ type:"setting", key:"recurringLog", value:state.recurringLog })
      .catch(function(){ showToast("No se pudo guardar."); });
  }

  function addWithdrawal(data){
    return apiPost({ sheet:"Retiros", op:"add", data:data })
      .then(function(){ return syncNow(); })
      .catch(function(){ showToast("No se pudo guardar."); });
  }

  function deleteWithdrawal(id){
    return apiPost({ sheet:"Retiros", op:"delete", id:id })
      .then(function(){ return syncNow(); })
      .catch(function(){ showToast("No se pudo eliminar."); });
  }

  // ---------- init ----------
  function initUser(){
    var saved = null;
    try { saved = localStorage.getItem("presupuesto_hz_user"); } catch(e){}
    if (saved){ state.currentUser = saved; renderWhoChip(); }
    else { showPicker(); }
  }

  function showPicker(){
    var overlay = document.getElementById("picker-overlay");
    var wrap = document.getElementById("picker-btns");
    wrap.innerHTML = "";
    [state.people.p1, state.people.p2].forEach(function(name){
      var b = document.createElement("button");
      b.className = "picker-btn";
      b.textContent = name;
      b.addEventListener("click", function(){
        state.currentUser = name;
        try { localStorage.setItem("presupuesto_hz_user", name); } catch(e){}
        overlay.hidden = true;
        renderWhoChip();
        render();
      });
      wrap.appendChild(b);
    });
    overlay.hidden = false;
  }

  function renderWhoChip(){
    var avatar = document.getElementById("who-avatar");
    var name = document.getElementById("who-name");
    var user = state.currentUser || "?";
    avatar.textContent = user.slice(0,1).toUpperCase();
    name.textContent = user;
  }

  document.getElementById("who-switch").addEventListener("click", showPicker);
  document.getElementById("prev-month").addEventListener("click", function(){
    state.monthDate = new Date(state.monthDate.getFullYear(), state.monthDate.getMonth()-1, 1);
    render();
  });
  document.getElementById("next-month").addEventListener("click", function(){
    state.monthDate = new Date(state.monthDate.getFullYear(), state.monthDate.getMonth()+1, 1);
    render();
  });
  Array.prototype.forEach.call(document.querySelectorAll("#tabs button"), function(btn){
    btn.addEventListener("click", function(){
      state.tab = btn.getAttribute("data-tab");
      Array.prototype.forEach.call(document.querySelectorAll("#tabs button"), function(b){ b.classList.toggle("active", b===btn); });
      render();
    });
  });

  // ---------- derived data ----------
  function expensesForMonth(d){
    var key = monthKey(d);
    return state.expenses.filter(function(e){ return (e.date||"").slice(0,7) === key; });
  }
  function totalsByCategory(list){
    var totals = {};
    list.forEach(function(e){
      totals[e.category] = (totals[e.category]||0) + (Number(e.amount)||0);
    });
    return totals;
  }
  function totalsByCard(list){
    var totals = {};
    list.forEach(function(e){
      if (e.payMethod === "credito" && e.card){
        totals[e.card] = (totals[e.card]||0) + (Number(e.amount)||0);
      }
    });
    return totals;
  }
  function dateForDay(monthDate, day){
    var y = monthDate.getFullYear(), m = monthDate.getMonth();
    var lastDay = new Date(y, m+1, 0).getDate();
    var d = Math.min(Math.max(parseInt(day,10)||1, 1), lastDay);
    return y + "-" + pad2(m+1) + "-" + pad2(d);
  }
  function pendingRecurringForMonth(monthDate){
    var key = monthKey(monthDate);
    return state.recurringTemplates.filter(function(t){ return t.active !== false; }).filter(function(t){
      return !state.recurringLog[t.id + "_" + key];
    }).sort(function(a,b){ return (a.day||1) - (b.day||1); });
  }

  // ---------- render ----------
  function render(){
    document.getElementById("month-label").textContent = monthLabel(state.monthDate);
    var view = document.getElementById("view");
    view.innerHTML = "";
    if (state.tab === "resumen") view.appendChild(renderResumen());
    else if (state.tab === "agregar") view.appendChild(renderAgregar());
    else if (state.tab === "historial") view.appendChild(renderHistorial());
    else if (state.tab === "recurrentes") view.appendChild(renderRecurrentes());
    else if (state.tab === "ahorros") view.appendChild(renderAhorros());
    else if (state.tab === "graficas") view.appendChild(renderGraficas());
    else if (state.tab === "presupuestos") view.appendChild(renderPresupuestos());
  }

  function renderResumen(){
    var frag = document.createDocumentFragment();
    if (state.connectionError){
      var flag = document.createElement("div");
      flag.className = "mode-flag";
      flag.textContent = "Sin conexión con la Hoja de Google — mostrando los últimos datos que se pudieron cargar";
      frag.appendChild(flag);
    }

    var pending = pendingRecurringForMonth(state.monthDate);
    if (pending.length){
      var pendingCard = document.createElement("div");
      pendingCard.className = "card pending-card";
      var pHead = document.createElement("div");
      pHead.className = "section-title";
      pHead.innerHTML = '<span class="badge-count">'+pending.length+'</span> Gastos recurrentes pendientes de '+monthLabel(state.monthDate);
      pendingCard.appendChild(pHead);

      pending.forEach(function(t){
        var row = document.createElement("div");
        row.className = "pending-row";
        var cat = catById(t.category);
        var payText = t.payMethod === "credito" ? ("Crédito · " + (cardById(t.card) ? cardById(t.card).label : "—")) : (t.payMethod === "debito" ? "Débito" : "Efectivo");
        row.innerHTML =
          '<div class="p-info"><div class="p-name">'+t.name+'</div><div class="p-meta">'+cat.name+' · '+payText+(t.day? ' · día '+t.day : '')+'</div></div>' +
          '<div class="p-amount"><span class="q-prefix">Q</span><input type="number" min="0" step="0.01" value="'+(t.amount!=null?t.amount:"")+'" class="p-amount-input"></div>' +
          '<div class="p-actions"><button class="btn-ghost p-skip">Omitir este mes</button><button class="btn-primary p-confirm">Confirmar</button></div>';
        var amountInput = row.querySelector(".p-amount-input");
        row.querySelector(".p-confirm").addEventListener("click", function(){
          var amt = parseFloat(amountInput.value);
          if (!amt || amt<=0){ amountInput.focus(); showToast("Ingresa un monto válido"); return; }
          var key = t.id + "_" + monthKey(state.monthDate);
          var dateStr = dateForDay(state.monthDate, t.day || 1);
          addExpense({
            amount: amt, category: t.category, payMethod: t.payMethod, card: t.card || null,
            date: dateStr, description: t.name, person: state.currentUser || "?",
            createdAt: Date.now(), recurringId: t.id
          }).then(function(){
            state.recurringLog[key] = { status:"confirmed" };
            saveRecurringLog();
            if (amt !== t.amount){
              var patched = Object.assign({}, t, { amount: amt });
              delete patched.id;
              updateRecurringFull(t.id, patched);
            }
            showToast("Gasto recurrente confirmado");
            render();
          });
        });
        row.querySelector(".p-skip").addEventListener("click", function(){
          var key = t.id + "_" + monthKey(state.monthDate);
          state.recurringLog[key] = { status:"skipped" };
          saveRecurringLog();
          showToast("Omitido este mes");
          render();
        });
        pendingCard.appendChild(row);
      });
      frag.appendChild(pendingCard);
    }

    var monthExpenses = expensesForMonth(state.monthDate);
    var totals = totalsByCategory(monthExpenses);
    var totalSpent = monthExpenses.reduce(function(s,e){ return s + (Number(e.amount)||0); }, 0);
    var totalBudget = CATEGORIES.reduce(function(s,c){ return s + (Number(state.budgets[c.id])||0); }, 0);
    var remaining = totalBudget - totalSpent;

    var summaryRow = document.createElement("div");
    summaryRow.className = "summary-row";
    summaryRow.appendChild(tile("Gastado este mes", fmtQ(totalSpent), null));
    summaryRow.appendChild(tile("Presupuesto total", fmtQ(totalBudget), null));
    summaryRow.appendChild(tile(remaining>=0 ? "Disponible" : "Sobre el presupuesto", fmtQ(Math.abs(remaining)), remaining>=0 ? "good" : "over"));
    frag.appendChild(summaryRow);

    if (totalBudget > 0){
      var overallWrap = document.createElement("div");
      overallWrap.className = "overall-bar-wrap";
      var pct = totalBudget>0 ? Math.min(100, (totalSpent/totalBudget)*100) : 0;
      overallWrap.innerHTML =
        '<div class="bar-track"><div class="bar-fill" style="width:'+pct+'%; background:'+(totalSpent>totalBudget?'var(--red)':'var(--accent)')+'"></div></div>' +
        '<div class="meta"><span>'+pct.toFixed(0)+'% del presupuesto usado</span><span>'+monthExpenses.length+' movimiento'+(monthExpenses.length===1?'':'s')+'</span></div>';
      frag.appendChild(overallWrap);
    }

    // Tarjetas de crédito — cuánto se debe y fecha de pago
    var cardTotals = totalsByCard(monthExpenses);
    var cardsCard = document.createElement("div");
    cardsCard.className = "card cards-card";
    var ctHtml = '<div class="section-title">Tarjetas de crédito</div>';
    CARDS.forEach(function(c){
      var owed = cardTotals[c.id] || 0;
      ctHtml += '<div class="card-row"><span class="c-name">'+c.label+'</span>' +
        '<span class="c-due">'+(c.dueDay ? 'Vence el '+c.dueDay+' del mes' : 'Fecha de pago sin definir')+'</span>' +
        '<span class="c-amt num">'+fmtQ(owed)+'</span></div>';
    });
    cardsCard.innerHTML = ctHtml;
    frag.appendChild(cardsCard);

    if (monthExpenses.length === 0){
      var empty = document.createElement("div");
      empty.className = "card empty-state";
      empty.innerHTML = '<h3>Aún no hay gastos en '+monthLabel(state.monthDate)+'</h3><p>Registra el primero para empezar a ver el resumen del mes.</p>';
      var btn = document.createElement("button");
      btn.className = "btn-primary";
      btn.textContent = "Agregar gasto";
      btn.addEventListener("click", function(){
        document.querySelector('#tabs button[data-tab="agregar"]').click();
      });
      empty.appendChild(btn);
      frag.appendChild(empty);
      return frag;
    }

    // Group by Tipo General
    var groups = GENERALS.map(function(g){
      var cats = CATEGORIES.filter(function(c){ return c.general === g.id; });
      var spent = cats.reduce(function(s,c){ return s + (totals[c.id]||0); }, 0);
      var budget = cats.reduce(function(s,c){ return s + (Number(state.budgets[c.id])||0); }, 0);
      var pct = budget>0 ? (spent/budget)*100 : (spent>0 ? 100 : 0);
      var subs = cats.map(function(c){
        var cs = totals[c.id] || 0;
        var cb = Number(state.budgets[c.id]) || 0;
        return { c:c, spent:cs, budget:cb, pct: cb>0 ? (cs/cb)*100 : (cs>0?100:0) };
      }).filter(function(x){ return x.spent>0 || x.budget>0; })
        .sort(function(a,b){ return b.spent - a.spent; });
      return { g:g, spent:spent, budget:budget, pct:pct, subs:subs };
    }).filter(function(x){ return x.spent>0 || x.budget>0; })
      .sort(function(a,b){ return b.pct - a.pct; });

    groups.forEach(function(x){
      var gc = document.createElement("div");
      gc.className = "card group-card";
      var pctDisplay = Math.min(100, x.pct);
      var over = x.budget>0 && x.spent>x.budget;
      var html =
        '<div class="group-head"><span class="dot" style="background:'+x.g.color+'"></span><span class="g-name">'+x.g.name+'</span><span class="g-pct">'+(x.budget>0? Math.round(x.pct)+'%' : '')+'</span></div>' +
        '<div class="bar-track"><div class="bar-fill" style="width:'+pctDisplay+'%; background:'+(over?'var(--red)':x.g.color)+'"></div></div>' +
        '<div class="group-amounts"><span class="spent">'+fmtQ(x.spent)+'</span><span class="budget">'+(x.budget>0? 'de '+fmtQ(x.budget) : 'sin presupuesto')+'</span></div>' +
        (over ? '<div class="over-flag">Excedido por '+fmtQ(x.spent-x.budget)+'</div>' : '');
      if (x.subs.length){
        html += '<div class="sub-list">';
        x.subs.forEach(function(s){
          var sPct = Math.min(100, s.pct);
          var sOver = s.budget>0 && s.spent>s.budget;

        });

      }

  // ---------- Graficas ----------
  function renderGraficas(){
    var wrap = document.createElement("div");

    var byMonth = {};
    state.expenses.forEach(function(e){
      var key = (e.date||"").slice(0,7);
      if (!key) return;
      byMonth[key] = (byMonth[key]||0) + (Number(e.amount)||0);
    });
    var keys = Object.keys(byMonth).sort();

    var chartCard = document.createElement("div");
    chartCard.className = "card chart-card";

    if (keys.length === 0){
      chartCard.innerHTML = '<div class="section-title">Tendencia de gasto</div>' +
        '<div class="empty-state" style="padding:32px 10px;"><p>Aún no hay suficientes datos para mostrar una tendencia. Registra gastos en distintos meses para verla aquí.</p></div>';
      wrap.appendChild(chartCard);
      return wrap;
    }

    var points = keys.map(function(k){
      var parts = k.split("-");
      var y = parseInt(parts[0],10), m = parseInt(parts[1],10)-1;
      return { key:k, label: MONTH_ABBR[m] + " " + String(y).slice(2), value: byMonth[k] };
    });

    chartCard.innerHTML = '<div class="section-title">Tendencia de gasto por mes</div><div class="hint">Suma de todos los gastos registrados, mes a mes.</div>';
    var chartWrap = document.createElement("div");
    chartWrap.className = "chart-wrap";
    chartCard.appendChild(chartWrap);
    wrap.appendChild(chartCard);

    var W = 640, H = 260, padL = 46, padR = 14, padT = 16, padB = 30;
    var innerW = W - padL - padR, innerH = H - padT - padB;
    var maxVal = Math.max.apply(null, points.map(function(p){ return p.value; })) || 1;
    var niceMax = maxVal * 1.15;

    function xFor(i){ return points.length>1 ? padL + (innerW * i/(points.length-1)) : padL + innerW/2; }
    function yFor(v){ return padT + innerH - (innerH * v/niceMax); }

    var gridCount = 4;
    var gridSvg = "";
    var labelsSvg = "";
    for (var g=0; g<=gridCount; g++){
      var gv = niceMax * g/gridCount;
      var gy = yFor(gv);
      gridSvg += '<line class="chart-grid-line" x1="'+padL+'" x2="'+(W-padR)+'" y1="'+gy+'" y2="'+gy+'"></line>';
      labelsSvg += '<text class="chart-axis-label" x="'+(padL-8)+'" y="'+(gy+3)+'" text-anchor="end">'+fmtQCompact(gv)+'</text>';
    }

    var xLabelStep = points.length > 8 ? Math.ceil(points.length/8) : 1;
    var xLabelsSvg = "";
    points.forEach(function(p,i){
      if (i % xLabelStep === 0 || i === points.length-1){
        xLabelsSvg += '<text class="chart-axis-label" x="'+xFor(i)+'" y="'+(H-8)+'" text-anchor="middle">'+p.label+'</text>';
      }
    });

    var linePath = points.map(function(p,i){ return (i===0?"M":"L") + xFor(i).toFixed(1) + "," + yFor(p.value).toFixed(1); }).join(" ");
    var areaPath = linePath + " L" + xFor(points.length-1).toFixed(1) + "," + (padT+innerH) + " L" + xFor(0).toFixed(1) + "," + (padT+innerH) + " Z";

    var dotsSvg = points.map(function(p,i){
      var isLast = i === points.length-1;
      return '<circle class="chart-dot'+(isLast?' endpoint':'')+'" cx="'+xFor(i).toFixed(1)+'" cy="'+yFor(p.value).toFixed(1)+'" r="4"></circle>';
    }).join("");

    var svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("viewBox", "0 0 " + W + " " + H);
    svg.innerHTML =
      gridSvg + labelsSvg + xLabelsSvg +
      '<path class="chart-area" d="'+areaPath+'"></path>' +
      '<path class="chart-line" d="'+linePath+'"></path>' +
      dotsSvg +
      '<line class="chart-hover-line" id="hover-line" x1="0" x2="0" y1="'+padT+'" y2="'+(padT+innerH)+'" style="display:none"></line>';
    chartWrap.appendChild(svg);

    var tooltip = document.createElement("div");
    tooltip.className = "chart-tooltip";
    chartWrap.appendChild(tooltip);

    var hoverLine = svg.querySelector("#hover-line");

    function handleMove(clientX){
      var rect = svg.getBoundingClientRect();
      var scale = W / rect.width;
      var localX = (clientX - rect.left) * scale;
      var idx = 0, best = Infinity;
      points.forEach(function(p,i){
        var d = Math.abs(xFor(i) - localX);
        if (d < best){ best = d; idx = i; }
      });
      var px = xFor(idx), py = yFor(points[idx].value);
      hoverLine.style.display = "block";
      hoverLine.setAttribute("x1", px); hoverLine.setAttribute("x2", px);
      var pxPct = (px / W) * rect.width;
      var pyPct = (py / H) * rect.height;
      tooltip.style.left = pxPct + "px";
      tooltip.style.top = (pyPct - 8) + "px";
      tooltip.textContent = points[idx].label + " · " + fmtQ(points[idx].value);
      tooltip.classList.add("show");
    }
    svg.addEventListener("mousemove", function(ev){ handleMove(ev.clientX); });
    svg.addEventListener("mouseleave", function(){ hoverLine.style.display = "none"; tooltip.classList.remove("show"); });
    svg.addEventListener("touchmove", function(ev){ if (ev.touches[0]) handleMove(ev.touches[0].clientX); }, { passive:true });
    svg.addEventListener("touchend", function(){ hoverLine.style.display = "none"; tooltip.classList.remove("show"); });

    return wrap;
  }

  // ---------- boot ----------
  var POLL_MS = 20000;

  function boot(){
    initUser();
    render();
    syncNow(true);

    // Refresca periódicamente para ver lo que agregue la otra persona
    setInterval(function(){ syncNow(false); }, POLL_MS);

    // Refresca al volver a la pestaña/app (útil en el celular al cambiar de app y volver)
    document.addEventListener("visibilitychange", function(){
      if (!document.hidden) syncNow(false);
    });
  }

  boot();
})();
</script>
</body>
</html>
